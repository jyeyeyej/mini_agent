services:
  travel-mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    env_file:
      - .env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8010
    ports:
      - "8013:8010"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      TRAVEL_MCP_URL: http://travel-mcp:8010/mcp
    ports:
      - "8003:8000"
    depends_on:
      travel-mcp:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_API_URL: http://backend:8000
    ports:
      - "8503:8501"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
