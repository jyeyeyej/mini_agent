# GitHub Actions 목록과 실행 결과 화면에 표시되는 Workflow 이름입니다.
name: 03 MCP CI

# MCP 프로젝트 또는 이 워크플로 파일이 바뀔 때만 실행합니다.
on:
  push:
    paths:
      - "mini_agent_03_mcp/**"
      - ".github/workflows/03-mcp-ci.yml"
  pull_request:
    paths:
      - "mini_agent_03_mcp/**"
      - ".github/workflows/03-mcp-ci.yml"
  workflow_dispatch:

# CI는 소스와 Dockerfile을 읽고 이미지를 빌드할 뿐이므로 최소 권한만 부여합니다.
permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini_agent_03_mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q backend frontend mcp_server
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
