name: 03 MCP CI CD

on:
  push:
    branches:
      - main
    paths:
      - "mini_agent_03_mcp/**"
      - ".github/workflows/03-mcp-ci.yml"
  pull_request:
    paths:
      - "mini_agent_03_mcp/**"
      - ".github/workflows/03-mcp-ci.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy Mini Agent 03 MCP to AWS EC2"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mini-agent-03-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini_agent_03_mcp
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Test backend API
        run: python -m pytest backend/tests/test_api.py -q

      - name: Check Python syntax
        run: python -m compileall -q backend frontend mcp_server

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build

  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure verified SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$AWS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy application source
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" 'mkdir -p ~/mini-agent-03-mcp'
          scp -r mini_agent_03_mcp/. "$AWS_USER@$AWS_HOST:~/mini-agent-03-mcp/"

      - name: Deploy and verify readiness
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" 'bash -s' <<'REMOTE'
          set -e
          cd ~/mini-agent-03-mcp
          test -f .env
          docker compose config --quiet
          docker compose up -d --build --remove-orphans

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error http://127.0.0.1:8003/health \
              && curl --fail --silent --show-error http://127.0.0.1:8003/api/mcp/status \
              && curl --fail --silent --show-error http://127.0.0.1:8503/_stcore/health; then
              exit 0
            fi
            echo "Application is not ready yet (${attempt}/12)"
            sleep 5
          done

          docker compose ps
          docker compose logs --tail=100 travel-mcp backend frontend
          exit 1
          REMOTE
