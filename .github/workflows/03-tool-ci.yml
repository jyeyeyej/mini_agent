# GitHub Actions 목록과 실행 결과 화면에 표시되는 Workflow 이름입니다.
name: 03 Tool CI

# Mini Agent 03 관련 파일 또는 이 워크플로가 바뀔 때만 실행합니다.
on:
  push:
    paths:
      - "mini_agent_03_tool/**"
      - ".github/workflows/03-tool-ci.yml"
  pull_request:
    paths:
      - "mini_agent_03_tool/**"
      - ".github/workflows/03-tool-ci.yml"
  workflow_dispatch:

# CI는 저장소를 읽기만 하므로 최소 권한만 부여합니다.
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini_agent_03_tool
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test backend contracts
        run: PYTHONPATH=backend python -m pytest backend/tests -q
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
